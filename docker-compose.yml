version: '3.9'

services:
  clientes-app:
    image: fabriciofsousa/fiap-carstore-clientes:latest
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_carstore:5432/FIAP-carStore
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8080"
    networks:
      - carstore-network
    depends_on: []

networks:
  carstore-network:
    external: true
